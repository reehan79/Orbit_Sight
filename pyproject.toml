[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitsight"
version = "0.1.0"
description = "Competition engineering toolkit for the TII OrbitSight Challenge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = ["scikit-learn>=1.5", "torch>=2.0", "onnx>=1.14", "onnxruntime>=1.16", "joblib>=1.3"]
submission = ["numpy==1.26.4", "scikit-learn==1.8.0", "joblib==1.5.3", "scipy==1.13.1"]

[project.scripts]
orbitsight-submission = "orbitsight.submission.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orbitsight = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
